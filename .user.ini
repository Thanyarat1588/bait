; PHP settings for hosts that run PHP as FPM / CGI (most shared hosts): there the php_value lines in .htaccess are
; ignored and the host's own limits (often 2-8 MB) would apply, while the admin forms accept videos up to 50 MB.
; With Apache's mod_php (XAMPP) this file is not read and .htaccess sets the same values. Changes take effect after
; up to 5 minutes (user_ini.cache_ttl). The web cannot read this file (.htaccess blocks *.ini and dot-files).
upload_max_filesize = 60M
post_max_size = 65M
max_execution_time = 180
memory_limit = 256M
display_errors = Off
log_errors = On
